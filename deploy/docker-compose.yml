services:
  bot:
    image: ghcr.io/akmalidinalimov/tgcommunitymanager:latest
    container_name: tgcm-bot
    restart: unless-stopped
    environment:
      TZ: Asia/Tashkent
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
      TELEGRAM_DISCUSSION_GROUP_ID: ${TELEGRAM_DISCUSSION_GROUP_ID}
      TELEGRAM_CHANNEL_USERNAME: ${TELEGRAM_CHANNEL_USERNAME}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
      TELEGRAM_APPROVER_IDS: ${TELEGRAM_APPROVER_IDS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REPLY_MODEL: ${REPLY_MODEL}
    command: ["python", "-m", "app", "--db", "/app/state/bot.db"]
    volumes:
      # Mutable state ONLY. This must never be /app/data: a volume mounted over
      # a path SHADOWS whatever the image baked there, and /app/data holds the
      # knowledge base, the backup pool and the voice guide. Mounting over them
      # left the bot running with an empty knowledge base, answering from model
      # memory — the exact failure the grounding gate exists to prevent.
      - tgcm-data:/app/state
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  tgcm-data:
