[project]
name = "tgcommunitymanager"
version = "0.1.0"
description = "Autonomous Telegram community manager for an Uzbek AI-education channel"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
