# Evergreen posts published unattended when a slot goes unapproved.
# No dates, no callbacks, nothing that stops being true.
# Every one must fit Telegram's 1024-char caption cap: these ship as captions
# under a video, and a post over the cap cannot be sent in that form at all.
posts:
- id: overlay-your-own-type
  kind: technique
  text: 'Rasmdagi yozuvni modelga yozdirmang. Oʻzingiz qoʻying.


    Sabab «model oʻzbekchani buzadi» emas — GPT Image 2 oʻ va gʻ ni toʻgʻri chiqaradi.


    Sabab amaliy:


    📌 Shrift sizniki boʻlib qoladi. Brend harfi har bir kadrda bir xil turadi.


    ✅ Mijoz «narxni oʻzgartiring» desa — yozuvni tahrirlaysiz, tamom. Rasm ichida boʻlsa, hammasini qaytadan
    chiqarasiz.


    ❗️Bitta kampaniyada 10 ta kadr boʻlsa, bu farq bir kunga teng.


    Shuning uchun rasmni boʻsh joyi bilan chiqaring: «empty space on the left for text».


    Yozuvni qaysi dasturda qoʻyasiz — Canva, Figma yoki telefonda? 👇

    '
- id: what-business-buys
  kind: why_content
  text: 'Biznes sizdan chiroyli rasm sotib olmaydi.


    Kafe egasiga rangi zoʻr kadr kerak emas — kechqurun stollari boʻsh qolmasligi kerak. Doʻkonchiga rasm
    emas, tovar tez sotilishi kerak.


    Shunchun prompt yozishdan oldin 3 ta savolni yozib olaman:


    • kim koʻradi;

    • qayerda koʻradi;

    • koʻrgandan keyin nima qilishi kerak.


    Uchtasiga javob boʻlmasa, rasm chizmayman. Chiroyli chiqadi, lekin kerak boʻlmaydi.


    Javob bor boʻlsa, ish oʻzgaradi. Instagram uchun kadr bilan vitrina uchun kadr bir xil boʻlmaydi.
    Referens ham, format ham oʻsha javobdan chiqadi.


    Endi «menga qanaqa rasm kerak» emas, balki «sizga nima kerak» deb soʻraysiz. Mijoz shu savolga pul
    toʻlaydi.

    '
- id: intent-and-the-set
  kind: commercial_craft
  text: 'Chiroyli rasm bilan pul toʻlanadigan rasm orasida bitta farq bor: birinchisida niyat yoʻq.


    📌 Niyat — bu «kim koʻradi va nima qiladi» degan savolga javob. Menyudagi kofe rasmi odamni ichkariga
    kirgizishi kerak. Shu bitta vazifa promptdan oldin yoziladi.


    ✅ Shunchun men rasmdan oldin qisqa brief yozaman: mahsulot, kimga, qayerda chiqadi, qanday hissiyot.
    4 qator, koʻp emas. Rasm shundan keyin chiqadi.


    ❗️Va eng muhimi — bittasi emas, seti. Bir xil yorugʻlik, bir xil rang, bir xil kadr mantigʻi. Biznes
    bitta kadrni emas, shu setni sotib oladi, chunki uni bir oy davomida ishlatadi.


    Yagona goʻzal kadr — portfolio uchun. Brief va set — buyurtma uchun.

    '
- id: four-things-that-move-an-image
  kind: technique
  text: 'Bitta prompt ichida 20 ta sifat yozasiz, rasm esa oʻsha-oʻsha chiqadi.


    Chunki natijani sifatlar emas, 4 ta narsa buradi:


    📌 subyekt — kim yoki nima kadrda turibdi, nima kiygan, nima qilyapti;


    📌 yorugʻlik — deraza yonidagi yumshoq yorugʻmi yoki tepadan tushgan qattiq nurmi;


    📌 kamera burchagi — pastdanmi, koʻz balandidanmi, tepadanmi;


    📌 linza — 35mm keng plan yoki 85mm yaqin portret.


    Mana shu 4 tasini aniq yozsangiz, uslub oʻzi keladi.


    «Chiroyli, professional, zoʻr, kinematografik» degan soʻzlar esa modelga hech narsa aytmaydi — ular
    hamma rasmga birdek toʻgʻri keladi.


    ✅ Preset ishlatsangiz, uslubni preset olib yuradi — ustiga sifat yogʻdirsangiz, natija chetga ogʻib
    ketadi. Shunchun preset bilan ishlaganda faqat shu 4 tasini yozing.


    Endi qayta-qayta generatsiya qilib oʻtirmaysiz — boshidan oʻzingiz oʻylagan kadr chiqadi.

    '
- id: starting-from-home
  kind: mission
  text: 'Uyda oʻtirib, qoʻlida faqat telefon bilan boshlagan odam ham AI bilan ishlay oladi.


    Boshida hech narsa bilmasangiz ham boʻladi. Kompyuter ham, diplom ham, ingliz tili ham shart emas.


    ❗️Lekin bir narsani ochiq aytay: bu tugmani bosib pul chiqadigan joy emas.


    Birinchi rasmlaringiz xunuk chiqadi. Prompt qayta-qayta yozasiz. Bitta kadr uchun oʻn marta urinasiz.
    Shu bosqichdan hamma oʻtadi.


    ✅ Oʻtib boʻlgach esa qoʻlingizda mahsulot qoladi: kafega menyu kadri, doʻkonga reels, brendga bir
    haftalik kontent. Biznes shunisiga pul toʻlaydi — chiroyli rasmga emas.


    Men shu kanalda oʻsha yoʻlni bosqichma-bosqich koʻrsataman. Telefon, sabr va bitta ish — boshlash
    uchun shuncha kifoya.

    '
