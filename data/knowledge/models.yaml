        made 2026-08-13, still on record and NOT overturned.
      source: founder
      founder_words: Omni bunday darajada qilib bera olmaydi. Kling 3.0 da qilishingizni tavsiya qilamiz
    note: 'Catalog re-read 2026-08-23. Filed under not_in_our_stack, which read as unavailable. It IS
