      still_unknown: [resolution, mode, duration, whether_reference_images_used]

# --- Asked about, but NOT in our toolset. Answer honestly. -------------------
not_in_our_stack:
  omni_flow:
    asked_by_member: true
    founder_verdict:
      text: "Cannot produce this level of cinematic quality. Recommend Kling 3.0 instead."
      source: founder
      founder_words: "Omni bunday darajada qilib bera olmaydi. Kling 3.0 da qilishingizni tavsiya qilaman"
  veo_3:
    source: catalog
    fact: "Not available in our Higgsfield catalog."
    honest_answer: >
      We don't use it, so we can't vouch for it. Say that plainly rather than
      reviewing a tool we have not run.
  flux_3_bfl_site:
    note: >
      A member (Abdumalik, post 606) linked bfl.ai claiming Flux 3 competes with
      Veo3 and speaks Uzbek. UNVERIFIED by us. Do not confirm or deny — invite
      them to share their result instead.

# --- Directional only. Never quote these numbers publicly. ------------------
external_benchmarks:
  source: web
  verified: false
  note: "Context for our own decisions. NEVER cite in a post or reply."
  claims:
    - "Seedance 2.0 ranked #1 on Artificial Analysis text-to-video and image-to-video leaderboards (June 2026)"
    - "Kling 3.0 released 2026-02-05; phoneme-level multi-character lip-sync"
    - "Veo 3.1 is the only model with native 48kHz synchronized dialogue"
    - "GPT Image 2 tops the Artificial Analysis generation and editing arenas"
    - "Nano Banana 2 leads on photorealism and subject consistency for product work"

# --- Hard rules the Replier applies before sending anything -----------------
rules:
  never_in_image_text:
    rule: "Never generate Uzbek text inside an image. Generate a clean plate, overlay type in editing."
    why: "Generative models garble Latin diacritics and Cyrillic. Teach it as a limitation plus workaround."
  no_unsupported_claims:
    rule: "If a model fact is not in this file, do not state it. Escalate to the founders."
  no_prices_from_memory:
    rule: >
      Never quote a subscription price or credit cost that is not in this file.
      Vendor pricing changes without notice. Direct people to check the vendor.
  mirror_the_script:
    rule: "Answer in the script the member wrote in — Latin or Cyrillic."
  do_not_interrupt_members:
    rule: >
      If another member has already answered the question, stay out. Member-to-member
      help is worth more than a bot reply and the bot must not crowd it out.
