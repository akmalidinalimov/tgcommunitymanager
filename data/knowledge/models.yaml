external_benchmarks:
  source: web
  verified: false
  note: Context for our own decisions. NEVER cite in a post or reply.
  claims:
  - 'Seedance 2.0 ranked #1 on Artificial Analysis text-to-video and image-to-video leaderboards (June
    2026)'
  - Kling 3.0 released 2026-02-05; phoneme-level multi-character lip-sync
  - Veo 3.1 is the only model with native 48kHz synchronized dialogue
  - GPT Image 2 tops the Artificial Analysis generation and editing arenas
  - Nano Banana 2 leads on photorealism and subject consistency for product work
rules:
  in_image_uzbek_text:
    rule: 'Do NOT claim that AI cannot write Uzbek. Tested 2026-08-14 on GPT Image 2: short bold display
      text rendered correctly, INCLUDING the okina — "QOʻSHIMCHA CHEGIRMA", "TOʻYGA TAYYORGARLIK", "AI
      YANGILIKLARI", "CHEGIRMA BOSHLANDI" all came out clean.

      '
    source: tested
    tested_on: gpt_image_2
    still_unknown:
    - long paragraphs rather than short display lines
    - small type
    - Cyrillic
    - other models (Soul, Nano Banana, Seedance, Kling)
    practice: 'Overlaying type is still the safer default for client work — it keeps the brand font, allows
      edits without regenerating, and is not exposed to any of the untested cases. But it is a workflow
      preference now, not a limitation, and the channel must not teach it as one.

      '
    history: 'The original rule said models garble Uzbek diacritics. It came from research predating this
      model and was never verified. It was baked into the voice guide, the shot grammar and an approved
      backup post before anyone tested it.

      '
  no_unsupported_claims:
    rule: If a model fact is not in this file, do not state it. Escalate to the founders.
  no_prices_from_memory:
    rule: 'Never quote a subscription price or credit cost from memory. A price is quotable only when
      it is in this file, or when a live web search just returned it from the VENDOR''S OWN page — with
      the source and the date.

      '
    source: founder
    founder_direction_2026_08_15: 'When a member asks something the open web can answer, go and find it
      instead of deflecting. Raise it to the founders only when it is unclear.

      '
    how_research_is_gated: 'app/agents/research.py searches, then refuses to publish unless the price
      is specific, from the vendor''s own domain, free of conflicting sources and high-confidence. Anything
      less goes to the admin chat WITH the evidence.

      '
    why_the_gate_is_strict: 'The first probe asked what Kling costs. Third-party trackers disagreed materially
      ($6.99 vs $10-15 for the same plan), no official page appeared in the results, and Kling shows THREE
      prices on one card — list $10, first-month promo $6.99, renewal $8.80. A bot that answers "$6.99"
      has told 3,326 people a number that is wrong from month two.

      '
    always_say: 'Quote the RENEWAL price, not the promotional one, and name the date. A price without
      a date is a price that will be wrong later.

      '
  mirror_the_script:
    rule: Answer in the script the member wrote in — Latin or Cyrillic.
  do_not_interrupt_members:
    rule: 'If another member has already answered the question, stay out. Member-to-member help is worth
      more than a bot reply and the bot must not crowd it out.

      '
  catalog_facts_expire:
    rule: 'Availability, resolution ceilings and modes are catalog facts, not permanent ones. Three entries
      here claimed a model was unavailable while it sat in the catalog, which would have had the bot telling
      members we do not use Veo 3 in the same week the channel published a Veo 3 comparison. Re-read the
      catalog before answering.

      '
    source: tested
    found: '2026-08-23'
