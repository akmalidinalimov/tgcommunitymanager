# AI model knowledge base — the ONLY source the Replier may cite for model facts.
#
# The Replier never answers a model question from LLM memory. If a claim is not
# here, it escalates to the founders instead of guessing. Model facts change
# monthly and a confidently wrong answer in front of 3,326 people costs more
# authority than staying silent.
#
# Every entry carries `source`, and they are not equal:
#   founder   — Shahlo/Akmalidin said it. Authoritative. Overrides everything.
#   catalog   — read from the live Higgsfield model catalog. Verified fact.
#   web       — third-party benchmark or review. Directional only. NEVER quote
#               a number from here in a post or reply.
#
# Verified against the Higgsfield catalog on 2026-08-13.

meta:
  verified_on: "2026-08-13"
  reverify_after_days: 30
  catalog_source: "Higgsfield models_explore (live account catalog)"

# --- What we recommend. Founder-stated, and what the bot leads with. ---------
recommendations:
  video:
    primary: [seedance_2_5, kling3_0]
    source: founder
    note: "Shahlo/Akmalidin's stated defaults for video."
  image:
    primary: [gpt_image_2, soul_2, midjourney]
    source: founder
    note: >
      Stated as 'gpt 2 and Higgsfield Soul'. gpt 2 = GPT Image 2 (OpenAI), confirmed in
      catalog. Midjourney added 2026-08-13: the founders use it regularly and had simply
      not listed it. Not available through Higgsfield — used directly.

# --- What may be said about tools ------------------------------------------
# Founder ruling, 2026-08-13: the test is TRUTH, not a whitelist. The initial
# list was only what they use most often, and treating it as exhaustive made the
# bot refuse to name real tools its audience already uses.
#
# So: naming any real AI tool is fine, and reporting a genuine, well-established
# capability is fine.
#
# What still requires a knowledge-base row:
#   - prices, subscription costs, credit costs
#   - specific capability claims ("X does Y at Z resolution/quality")
#   - comparative verdicts ("X is better than Y for Z")
#   - anything about OUR OWN work, results, or settings
#
# For a tool the founders have not tested, say so plainly and invite the member's
# result — the honest answer, and it produces exactly the member-generated
# artifacts the channel exists to create.
tool_mentions:
  naming_allowed: true
  source: founder
  requires_grounding:
    - price
    - credit_cost
    - specific_capability_claim
    - comparison_verdict
    - our_own_results_or_settings

