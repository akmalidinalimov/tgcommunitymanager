  nano_banana_flash:
    name: Nano Banana Flash
    provider: Google
    type: image
    source: tested
    resolution:
    - 1k
    - 2k
    - 4k
    good_for: dappled and directional daylight, natural shadow falloff, photorealism
    note: 'Added 2026-08-23. Reached by asking Higgsfield for nano_banana_2 — it rerouted the job and
      the generation record came back nano_banana_flash. That is now twice a Nano model has been mislabelled
      here, so ALWAYS name the model from the generation record, never from what was requested.

      '
    tested:
      daylight: 'Renders dappled light through a canopy convincingly: leaf shadows on a trunk harden or
        soften correctly with the distance to the occluder. Beat GPT Image 2 on the light itself in a
        same-prompt test, 2026-08-23.

        '
      night: 'Will not underexpose. Told three times in one prompt to leave most of the frame dark, it
        lit an entire stadium evenly. Its disposition is bright and complete and prompting does not override
        it — choose a different model for a dark frame rather than arguing with this one.

        '
      texture: Skin and fabric come back smoother than GPT Image 2, with less micro-detail.
