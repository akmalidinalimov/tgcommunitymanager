models:
  seedance_2_5:
    name: Seedance 2.5
    provider: Bytedance
    type: video
    source: catalog
    duration_s:
    - 4
    - 30
    resolution:
    - 480p
    - 720p
    - 1080p
    modes:
    - t2v
    - omni_reference
    - video_edit
    - video_extension
    audio: true
    good_for: text-to-video, editing or extending an existing video, reference-driven consistency
    caveat: 'Reaches 1080p. Seedance 2.0 reaches 4K, so the higher version number is NOT the higher-resolution
      model — check before promising 4K.

      Corrected 2026-08-23: this entry said ''caps at 720p in our account'', which the live catalog contradicts.
      Caught while drafting a post that would have published the wrong number. Third stale catalog fact
      found this week; re-read, do not remember.

      '
