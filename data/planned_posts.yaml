# Posts written by hand for a specific slot. These win over the Writer.
#
# Everything downstream is unchanged: a planned post still goes to Shahlo for
# approval, still publishes through the same path, still falls back to the
# backup pool if nobody approves it. The only difference is where the words
# came from.
#
# Lint runs at load, not at publish. A hand-written post can break the caption
# cap or carry a banned construction exactly like a generated one, and finding
# that out at 10:00 on the day is finding out too late — a post that fails is
# refused here and the slot falls through to the Writer.
#
# `asset` is a media-library id, or `card` to render one on the VPS.

posts:
  # --- week of 24 August: model comparisons, one post a day at 21:00 --------

  "2026-08-24_21:00":
    kind: technique
    assets:
      - tree-portrait-gpt
      - tree-portrait-nano
    note: >
      Approved by Akmalidin on 2026-08-23, images and text together. Text
      rewritten hook-first on 2026-08-23 at his direction.

      The first draft opened "bitta prompt yozdim va ikkita modelga berdim" —
      a process statement, which spends the one line a Telegram reader sees
      before deciding to expand. It now opens on the question the audience
      actually has, tied to money, which is the channel's differentiator:
      which model makes pictures a brand pays for.

      That miss had a cause worth recording. The Voice Critic already asks
      whether an opening earns attention in three seconds, but a hand-written
      planned post never reaches the Critic — planned.load() runs mechanical
      lint and nothing else. The standard existed and the publishing path we
      actually use bypassed it. lint.opening_problems() now binds hand-written
      posts too.

      One prompt, two models, published as one Telegram album — a comparison is
      one post with two pictures, not two posts nobody reads together. The
      prompt is layered: subject, one compound camera setup (low at 40cm,
      medium, side profile turning to lens), foreground / midground /
      background, then about ten sentences on the light alone.

      The finding is the post, and it was not the expected one. In an earlier
      night test GPT dominated and Nano would not underexpose at any amount of
      instruction. In daylight they swap: Nano renders the dappled leaf shadows
      with correct penumbra, GPT renders skin, linen and bark. So "which model
      is more realistic" has no stable answer — it depends on the light, and the
      practical advice is to choose per shot rather than to have a favourite.

      Names the model from the GENERATION RECORD: nano_banana_flash, not the
      nano_banana_2 that was requested. Second time a Nano model has been
      mislabelled here.

      Needs the album path in `_deliver` and `send_media_group`; both were added
      for this post. The images are 6.2MB and 0.9MB, so they upload as multipart
      rather than by URL, which Telegram caps at 5MB.
    text: |
      Qaysi model brendlar pul toʻlaydigan darajada haqiqiy rasm chiqaradi?

      Bilish uchun bitta prompt yozdim va ikkala modelga bir xil berdim. Daraxt tagida oʻtirgan qiz, barglar orasidan tushayotgan quyosh. Bunday yorugʻlikni chizish eng qiyini, sinovni shunda qildim.

      📌 GPT Image 2 mayda detalni oldi. Yuzdagi sepkillar, roʻmolning zigʻir toʻqimasi, chinor poʻstlogʻining koʻchgan qatlamlari.

      📌 Nano Banana Flash yorugʻlikni oldi. Daraxt tanasidagi barg soyalari: bir joyda chekkasi aniq, bir joyda yumshoq. Haqiqiy quyosh aynan shunday tushadi.

      Bittasi aniq yutadi deb oʻylagandim. Yutmadi. Ikkalasi ham boshqa-boshqa narsada kuchli chiqdi.

      ✅ Shuning uchun modelni oldindan tanlab qoʻymayman. Avval kadrda nima muhimligini hal qilaman: teri va matomi, yoki yorugʻlikmi. Model shundan keyin tanlanadi.

      Ikkalasi bitta promptdan chiqqan. Qaysi biri haqiqiyroq — 1 yoki 2? Bitta raqam yozing 👇
    seed_comment: |
      Promptning eng uzun qismi yorugʻlikka ketgan. Mana shunday yozilgan: quyosh orqadan va chap tomondan, barglar orasidan tushadi; soyaning chekkasi barg yaqin boʻlsa aniq, uzoq boʻlsa yumshoq; soyada qolgan yuzni osmonning koʻk yorugʻligi toʻldiradi.

      Bitta jumla emas, oʻn jumla. Yorugʻlikni qanchalik aniq yozsangiz, natija shunchalik haqiqiyga yaqin chiqadi.

      Toʻliq promptni soʻrasangiz shu yerga tashlayman.

      Bitta jumla emas, oʻn jumla. Yorugʻlikni qanchalik aniq yozsangiz, rasm shunchalik haqiqiyga yaqin chiqadi.

      Toʻliq promptni soʻrasangiz shu yerga tashlayman.

  "2026-08-25_21:00":
    kind: technique
    assets:
      - tower-dive-2-0-a
      - tower-dive-2-5-b
    note: >
      The two clips Akmalidin picked from the Higgsfield gallery. His share
      links resolve to jobs 3c947eb9 (seedance_2_0, take 1) and 20f02a4c
      (seedance_2_5, take 2), both generated here on 2026-08-23.

      Note which 2.5 take that is: take 2, the weaker of its two in the frame
      read. He watched them in motion and I did not, so his judgement stands,
      but the caption says two takes were run per model rather than implying
      this was 2.5's only attempt. Cherry-picking a failure is only fair with
      the count attached.

      The post carries the finding that matters more than the ranking: NEITHER
      model produced the actual Toshkent teleminorasi. The prompt named it and
      described the three splayed legs. Both invented a different tower. Saying
      that first is the only safe move — this audience has stood under it, and
      a member pointing it out in the comments is far worse than us pointing it
      out in the post.

      Replaces the tandyr physics comparison that held this slot. Same topic,
      and these clips are the ones the founder chose. The tandyr clips stay in
      the library for a later post.

      The seed comment PROMISES a reference-image follow-up. That is a real
      commitment and the channel's own callback style, but it has to be kept.
    text: |
      Ikkala videoni bitta prompt chiqargan. Farqni topa olasizmi?

      Promptda shunday yozilgan: kamera burgut bilan birga minora yonidan pastga tushadi. Ikkalasi ham 720p, ikkalasi ham 5 soniya, soʻzlar ham bir xil. Faqat model boshqa.

      📌 Seedance 2.0 minorani panjarali temir konstruksiya qilib chiqardi, promptda soʻralganidek. Yonidan oʻtayotgan temirlar tezlikdan yoyilib ketadi. Burgut qanotini yigʻadi, uchidagi patlar ajralib turadi.

      📌 Seedance 2.5 esa silliq oq minora chizdi, panjara yoʻq. Burgut sakrashning oʻrtasida qanot shaklini yoʻqotadi.

      ❗️ Lekin ikkalasi ham Toshkent teleminorasini chiqara olmadi. Men nomini ham yozdim, uchta oyogʻini ham taʼrifladim. Ikkalasi ham oʻzicha boshqa minora oʻylab topdi.

      ✅ Model sizning shahringizni bilmaydi. Aniq bir joy kerak boʻlsa, promptga nom yozish yetmaydi, referens rasm kerak.

      Sizningcha qaysi biri tabiiyroq — 1 yoki 2? 👇
    seed_comment: |
      Har bir modelga ikki martadan urinish berdim, chunki tez kamera harakati har safar bir xil chiqmaydi. Yuqoridagilar oʻsha urinishlardan.

      Sinov shartlari ataylab bir xil: 720p, 5 soniya, bitta prompt. 2.0 aslida 4K gacha chiqara oladi, 2.5 esa yoʻq. Agar 2.0 ni 4K da qoʻysam, uning aniqligini harakat sifati deb oʻylagan boʻlardim.

      Keyingi qadam ham shu yerdan chiqdi: haqiqiy minorani chiqarish uchun referens rasm bilan sinab koʻraman va natijasini shu yerda koʻrsataman.


