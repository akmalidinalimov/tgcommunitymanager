  "2026-08-19_10:00":
    kind: technique
    asset: uzum-ui-carousel-uz-169
    note: >
      The boundary post. One prompt produced a whole Uzbek interface — thirty
      strings, three type sizes — cleanly. What it also produced, unasked, was a
      manufacturer wordmark and invented ratings. That is the lesson a designer
      gets burned by once. The seed comment carries the counting failure with its
      real numbers.
    text: |
      Bu karuselni bitta prompt bilan chiqardim. Butun interfeys, oʻttizga yaqin yozuv, hammasi oʻzbekcha va joyida, hatto soʻmdagi narxlar ham toʻgʻri chiqibdi.

      Lekin diqqat bilan qaraganimda, model men soʻramagan narsalarni oʻzicha qoʻshib qoʻyganini koʻrdim.

      📌 Fotoapparatning ustiga mashhur brendning nomi yozilgan ekan. Krossovkada ham oʻsha firmaning belgisi turibdi, promptda bunday narsa yoʻq edi.

      📌 Reytinglar ham oʻzidan chiqqan. 4.6, 4.8 degan raqamlarni model oʻylab topgan, men unga hech qanday raqam bermagandim.

      ❗️ Shunday kartani mijozga topshirsangiz, javob berish sizga toʻgʻri keladi. Brend belgisi uchun ham, oʻylab topilgan raqamlar uchun ham.

      ✅ Shunchun har bir promptga bitta qator qoʻshib qoʻyaman: «no brand names, no logos, no invented ratings». Bitta gap, lekin ishini qiladi.

      Sizda ham AI soʻramagan narsani qoʻshib bergani boʻlganmi? 👇
    seed_comment: |
      Yana bitta chegara: model sanay olmaydi.

      «6 kishilik toʻplam» deb yozdim, u 5 ta piyola chizdi. «Aniq oltita» deb uch marta takrorladim — 7 ta, keyin 8 ta chizdi.

      Ishlagan yechim boshqacha edi: «uch tadan ikki qator». Sanoqni soʻz bilan emas, kompozitsiya bilan hal qilasiz.

