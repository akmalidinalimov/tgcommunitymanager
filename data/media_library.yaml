  provenance: 'Same prompt, same subject, same 9:16 2K frame; only the model differs. Paired with tree-portrait-nano
    — they are published together as one Telegram album and are meaningless apart. Generated 2026-08-23.
    The prompt specified dappled sunlight through a plane-tree canopy, which is the hardest light to fake:
    shadow edges must harden as the occluding leaf gets closer, and shaded skin must be filled by cool
    skylight against warm sun. higgsfield job 5a05ccff. Wins on micro-texture: skin, linen and bark. 6.2MB
    against the Nano half''s 0.9MB, which is real high-frequency detail rather than a compression difference.
    Its dappled patches ON the subject are subtler than asked for — mostly rim light. No trademarks, no
    lettering; both were checked.'
