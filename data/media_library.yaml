  expires: true
  provenance: 'higgsfield job 40d0f72e, 2026-08-22. The control in a three-way test: the prompt asked
    for ''promotional text in the Uzbek language'' without dictating the words. Spelling and grammar came
    back correct, which refutes the research brief''s claim that models garble Uzbek glyphs. What it got
    wrong was register: it chose kutmoqda, the form the voice guide bans outright, and wrote a headline
    containing no number, no time and no offer. This asset IS the evidence for that post.'
