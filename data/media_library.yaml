    — they are published together as one Telegram album and are meaningless apart. Generated 2026-08-23.
    The prompt specified dappled sunlight through a plane-tree canopy, which is the hardest light to fake:
    shadow edges must harden as the occluding leaf gets closer, and shaded skin must be filled by cool
    skylight against warm sun. higgsfield job 0540d929. **Requested nano_banana_2; the generation record
    says nano_banana_flash** — Higgsfield rerouted it, so that is the name to publish. This is the second
    time the library and the record have disagreed about a Nano model; always read the record. Wins on
    the light itself: the leaf shadows on the trunk have correct penumbra behaviour, which is the hard
    part. Note this REVERSES the night-stadium result, where Nano over-lit and lost — realism has no stable
    winner, it depends on the light.'
